<!DOCTYPE html>
<html>
<head>
  <!-- font update -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    .hero-text h1 {
      font-size: 2em; /* smaller title */
    }
    .hero-text .subhead {
      font-family: 'Roboto Mono', monospace; /* Roboto Mono subtitle */
      font-size: 1em; /* smaller subtitle */
    }
    figcaption {
      font-family: 'Roboto Mono', monospace; /* Roboto Mono caption */
    }
    .wide-image {
      width: 120%;
      margin-left: -10%;
    }
    .step {
      margin: 0 auto 25vh; /* reduce bottom margin */
    }
    .sticky-thing:last-child {
      position: sticky;
      top: 0;
    }
  </style>
</head>
<body>

  <!-- Example of applying the wide-image class to the second image -->
  <figure class="wide-image">
    <img src="second-image.jpg" alt="Second image wider than text">
    <figcaption>Wider image caption</figcaption>
  </figure>

  <!-- Example of steps, with step 10 removed -->
  <section class="scrolly-overlay">
    <div class="step">Step 1 text</div>
    <div class="step">Step 2 text</div>
    <div class="step">Step 3 text</div>
    <div class="step">Step 4 text</div>
    <div class="step">Step 5 text</div>
    <div class="step">Step 6 text</div>
    <div class="step">Step 7 text</div>
    <div class="step">Step 8 text</div>
    <div class="step">Step 9 text</div>
    <!-- Step 10 removed -->
  </section>

  <!-- Last sticky image -->
  <div class="sticky-thing">
    <img src="final-image.png" alt="Sticky last image">
  </div>

</body>
</html>
